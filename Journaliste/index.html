<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace journaliste — N_hebert2</title>
<link rel="icon" href="https://cdn.discordapp.com/attachments/1395812809366966403/1536784370214506607/0974951d-22a4-4bbf-9307-af2539661e41.png?ex=6a7ca979&is=6a7b57f9&hm=5eb574b1cf61e6955d4fd62d573e2a0f1e86e67264880d28cfa831d699a77f5e&animated=true">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--card:#141416;--card2:#1a1a1d;--line:#2a2a2e;--line2:#3a3a3f;--txt:#f4f2ec;--mut:#a09e96;--gold:#d2a74b;--gold-l:#e3bc6a;--gold-d:#8f6f2a;--danger:#d64545;--sans:'Archivo',sans-serif;--serif:'Newsreader',serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font-family:var(--sans);cursor:pointer}
a{color:var(--gold)}
.ic{display:inline-block;vertical-align:-3px;flex:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{background:var(--card);border:1px solid var(--line2);border-top:3px solid var(--gold);padding:38px 34px;width:100%;max-width:400px;text-align:center}
.login-box img{width:150px;margin:0 auto 18px}
.login-box h1{font-family:var(--serif);font-size:1.4rem;font-weight:700;margin-bottom:4px}
.login-box p{color:var(--mut);font-size:.82rem;margin-bottom:22px}
.login-box input{width:100%;background:var(--card2);border:1px solid var(--line2);color:var(--txt);padding:12px;border-radius:2px;font-size:.95rem;margin-bottom:14px;text-align:center}
.login-box input:focus{border-color:var(--gold);outline:none}
.err{color:var(--danger);font-size:.78rem;margin-bottom:10px;min-height:1em}

/* ---------- dashboard ---------- */
header{background:#000;border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:40}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px}
.hd .brand{display:flex;align-items:center;gap:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}
.hd .brand .ic{color:var(--gold)}
.hd nav{display:flex;gap:8px}
.hbtn{display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid var(--line2);color:var(--mut);padding:7px 12px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-radius:2px;text-decoration:none;transition:.2s}
.hbtn:hover{border-color:var(--gold);color:var(--gold)}
main{padding:34px 0 80px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tab{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line2);color:var(--mut);padding:10px 16px;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;border-radius:2px;transition:.2s}
.tab:hover{border-color:var(--gold);color:var(--gold)}
.tab.on{background:var(--gold);border-color:var(--gold);color:#000}
.panel{background:var(--card);border:1px solid var(--line);padding:24px}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.panel-top h2{font-family:var(--serif);font-size:1.2rem;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);border:1px solid var(--gold-d);color:#000;padding:10px 16px;font-weight:800;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;border-radius:2px;transition:.2s}
.btn:hover{background:var(--gold-l)}
.btn.ghost{background:none;color:var(--mut);border:1px solid var(--line2)}
.btn.ghost:hover{color:var(--txt);border-color:var(--txt)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}

/* ---------- liste ---------- */
.row-item{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--card2);padding:10px 12px;margin-bottom:8px}
.row-item .thumb{width:64px;height:48px;object-fit:cover;border:1px solid var(--line2);flex:none;background:#222}
.row-item .thumb.ph{min-height:48px}
.row-item .inf{flex:1;min-width:0}
.row-item .inf b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .inf span{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.row-item .acts{display:flex;gap:6px;flex:none}
.ibtn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line2);color:var(--mut);padding:7px 10px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:2px}
.ibtn:hover{border-color:var(--gold);color:var(--gold)}
.ibtn.del:hover{border-color:var(--danger);color:var(--danger)}

/* ---------- formulaire ---------- */
#formPanel{border:1px solid var(--gold-d);border-top:3px solid var(--gold);background:var(--card);padding:24px;margin-bottom:26px}
#formPanel[hidden]{display:none}
#formPanel h3{font-family:var(--serif);font-size:1.1rem;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{margin-bottom:14px}
label{display:block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line2);color:var(--txt);padding:10px;border-radius:2px;font-size:.9rem;font-family:var(--sans)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{min-height:120px;resize:vertical}
.form-acts{display:flex;gap:10px;margin-top:6px}
.note{margin-top:22px;padding:14px 16px;border:1px dashed var(--line2);color:var(--mut);font-size:.8rem}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:11px 22px;font-weight:700;font-size:.84rem;border:1px solid var(--gold-d);border-left:3px solid var(--gold);border-radius:2px;z-index:120;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.row-item .inf b{white-space:normal}}
</style>
</head>
<body>

<!-- =========== ECRAN DE CONNEXION =========== -->
<div id="login">
  <div class="login-box">
    <img id="loginLogo" alt="N_hebert2" src="https://cdn.discordapp.com/attachments/1395812809366966403/1536784370214506607/0974951d-22a4-4bbf-9307-af2539661e41.png?ex=6a7ca979&is=6a7b57f9&hm=5eb574b1cf61e6955d4fd62d573e2a0f1e86e67264880d28cfa831d699a77f5e&animated=true">
    <h1>Espace journaliste</h1>
    <p>Accès réservé à Nathan Hébert-Labelle</p>
    <form id="loginForm">
      <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
      <div class="err" id="err"></div>
      <button class="btn" type="submit" style="width:100%;justify-content:center">Entrer</button>
    </form>
  </div>
</div>

<!-- =========== TABLEAU DE BORD =========== -->
<div id="dash" hidden>
<header><div class="wrap hd" style="padding-left:0;padding-right:0">
  <span class="brand" id="brand"></span>
  <nav>
    <a class="hbtn" href="../" id="seeSite"></a>
    <button class="hbtn" id="logout"></button>
  </nav>
</div></header>
<main class="wrap" style="padding-left:0;padding-right:0">
  <div class="tabs" id="tabs"></div>

  <div id="formPanel" hidden></div>

  <div class="panel">
    <div class="panel-top">
      <h2 id="panelTitle"></h2>
      <div style="display:flex;gap:8px">
        <button class="btn" id="addBtn"></button>
        <button class="btn ghost" id="resetBtn"></button>
      </div>
    </div>
    <div id="list"></div>
  </div>

  <p class="note" id="note"></p>
</main>
</div>
<div id="toast"></div>

<script>
/* =============== CONFIG =============== */
const PASS = 'Nathanlol1@';
const LS_KEY = 'nh2_site_v2';   // meme cle que le site principal

/* =============== ICONES =============== */
const IC={
lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
reset:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'
};
const ic=(n,s=16)=>'<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(IC[n]||'')+'</svg>';

/* =============== DONNEES PAR DEFAUT (identiques au site) =============== */
const SEED=JSON.parse(JSON.stringify({
articles:[
 {id:'a1',cat:'feu',ph:'feu',featured:1,views:5240,place:'Saint-Roch, Québec',date:'2025-06-21',title:'Incendie majeur à Saint-Roch : personne ne manque à l'appel',text:['Un incendie d'origine électrique a lourdement endommagé un immeuble de six logements de la rue Saint-Joseph, tôt samedi matin. Une quarantaine de pompiers ont été nécessaires pour maîtriser les flammes en un peu plus de deux heures.','Grâce aux avertisseurs de fumée et à la réaction rapide des résidents, tous ont pu évacuer à temps. La Croix-Rouge a pris en charge trois familles sinistrées.','« C'est le genre de nuit où on est contents de nos exercices », confie un lieutenant pendant que l'échelle aérienne terminait l'extinction des points chauds.']},
 {id:'a2',cat:'communaute',ph:'fest',views:4810,place:'Vieux-Port, Québec',date:'2025-06-14',title:'Festival de la Poutine : une affluence record pour la 12e édition',text:['Plus de 30 000 visiteurs ont envahi le Vieux-Port durant le week-end, faisant de cette 12e édition la plus achalandée de l'histoire du festival.','Vingt-deux cantines se sont affrontées au concours de la poutine créative, et c'est une poutine au canard confit et fromage en grains de Charlevoix qui a ravi le jury.','Les organisateurs confirment déjà une 13e édition, avec une scène supplémentaire et une zone famille.']},
 {id:'a3',cat:'police',ph:'police',views:3970,place:'Limoilou, Québec',date:'2025-06-18',title:'Opération policière sur la 3e Avenue : un suspect arrêté',text:['Une opération ciblée du module des stupéfiants s'est conclue par une arrestation, mercredi en fin d'après-midi, près de la 3e Avenue.','Le périmètre de sécurité a forcé la fermeture de quelques commerces pendant environ une heure. Aucun incident n'a été rapporté.','Le Service de police rappelle que toute information peut être transmise de façon confidentielle.']},
 {id:'a4',cat:'ambulance',ph:'amb',views:2890,place:'Chaudière-Appalaches',date:'2025-06-10',title:'Temps de réponse ambulanciers : ça s'améliore en région',text:['Les plus récentes données montrent une amélioration des temps de réponse pour les appels prioritaires sur la rive sud.','Deux nouvelles ambulances de garde et un ajustement des quarts de travail expliquent en partie ce gain de quelques minutes précieuses.','Les paramédics restent prudents : « chaque minute compte, et ça se joue aussi avec la population qui cède le passage ».']},
 {id:'a5',cat:'securite',ph:'sec',views:2450,place:'Québec',date:'2025-06-08',title:'Verglas annoncé : la sécurité civile en mode veille',text:['En prévision d'un épisode de pluie verglaçante, la sécurité civile régionale a activé son centre de coordination.','On recommande à la population de préparer une trousse 72 h et de limiter ses déplacements pendant le pic attendu.','Hydro-Québec prépositionne des équipes supplémentaires dans les secteurs boisés.']},
 {id:'a6',cat:'divers',ph:'police',views:3320,place:'Beauport, Québec',date:'2025-06-05',title:'Personne disparue retrouvée saine et sauve à Beauport',text:['L'homme de 72 ans porté disparu depuis mardi a été retrouvé sain et sauf dans un secteur boisé de Beauport, grâce à un citoyen attentif.','Une recherche impliquant patrouilleurs, maître-chien et drones avait été mise en place.','La famille tient à remercier le public et les équipes d'urgence pour leur rapidité.']},
 {id:'a7',cat:'communaute',ph:'comm',views:1980,place:'Limoilou, Québec',date:'2025-06-02',title:'Corvée de quartier : Limoilou se retrousse les manches',text:['Près de 80 bénévoles ont participé à la corvée de printemps : nettoyage des ruelles, peinture de bancs et nouvelles boîtes à fleurs.','Le conseil de quartier souligne que plusieurs jeunes du secondaire se sont joints au mouvement.','Une seconde corvée est prévue à l'automne.']},
 {id:'a8',cat:'divers',ph:'sec',views:4100,place:'Autoroute 40, Québec',date:'2025-05-29',title:'Accident sur l'autoroute 40 : la circulation rouverte après 3 h',text:['Une collision impliquant deux camions semi-remorques a forcé la fermeture de l'autoroute 40 en direction est pendant plus de trois heures.','Le conducteur d'un des véhicules a été transporté pour des blessures mineures.','La Sûreté du Québec rappelle l'importance de ralentir à l'approche des véhicules d'intervention.']}
],
photos:[
 {id:'p1',tag:'festival',ph:'fest',place:'Vieux-Port',date:'2025-06-14',title:'Festival de la Poutine — foule du samedi'},
 {id:'p2',tag:'spectacles',ph:'fest',place:'Scène Saint-Jean',date:'2025-06-20',title:'Spectacle du soir, lumières et foule'},
 {id:'p3',tag:'police',ph:'police',place:'Centre-ville',date:'2025-05-30',title:'Patrouille de nuit, gyrophares'},
 {id:'p4',tag:'pompiers',ph:'feu',place:'Saint-Roch',date:'2025-06-21',title:'Échelle aérienne en action'},
 {id:'p5',tag:'ambulances',ph:'amb',place:'3e Avenue',date:'2025-06-18',title:'Intervention ambulancière'},
 {id:'p6',tag:'vehicules',ph:'feu',place:'Caserne 2',date:'2025-04-12',title:'Autopompe 204, sortie de caserne'},
 {id:'p7',tag:'evenements',ph:'comm',place:'Québec',date:'2025-06-24',title:'Défilé de la fête nationale'},
 {id:'p8',tag:'pompiers',ph:'feu',place:'Charlesbourg',date:'2025-05-10',title:'Exercice de désincarcération'},
 {id:'p9',tag:'police',ph:'police',place:'Expo Québec',date:'2025-05-17',title:'Maître-chien en démonstration'},
 {id:'p10',tag:'evenements',ph:'comm',place:'Limoilou',date:'2025-06-01',title:'Marché public du dimanche'},
 {id:'p11',tag:'vehicules',ph:'sec',place:'Autoroute 40',date:'2025-05-29',title:'Véhicule d'intervention, sécurité civile'},
 {id:'p12',tag:'ambulances',ph:'amb',place:'Poste 12',date:'2025-04-02',title:'Garde nocturne, poste 12'}
],
events:[
 {id:'e1',d:'2025-07-12',type:'Festival',place:'Vieux-Port, Québec',status:'ok',title:'Festival de la Poutine — jour 2'},
 {id:'e2',d:'2025-07-19',type:'Spectacle',place:'Scène Saint-Jean, Québec',status:'ok',title:'Spectacle extérieur d'été'},
 {id:'e3',d:'2025-08-02',type:'Communautaire',place:'Charlesbourg',status:'ok',title:'Défilé bénéfice des pompiers'},
 {id:'e4',d:'2025-08-15',type:'Sportif',place:'Expo Québec',status:'tbc',title:'Derby de démolition annuel'},
 {id:'e5',d:'2025-09-05',type:'Festival',place:'Beauport',status:'ok',title:'Week-end folklore et familles'}
]}));
const CATS={locales:'Actualités locales',police:'Services policiers',feu:'Services incendie',ambulance:'Ambulanciers',securite:'Sécurité civile',divers:'Faits divers',communaute:'Communauté'};
const TAGS={festival:'Festivals',spectacles:'Spectacles',police:'Police',pompiers:'Pompiers',ambulances:'Ambulances',vehicules:'Véhicules d'urgence',evenements:'Événements locaux'};
const PHMAP={police:'police',feu:'feu',ambulance:'amb',securite:'sec',divers:'sec',communaute:'comm',locales:'comm'};
const TGMAP={police:'police',pompiers:'feu',ambulances:'amb',vehicules:'sec',festival:'fest',spectacles:'fest',evenements:'comm'};

/* =============== ETAT =============== */
let DATA=SEED;
try{const s=JSON.parse(localStorage.getItem(LS_KEY)); if(s&&s.articles&&s.photos&&s.events)DATA=s}catch(e){}
const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(DATA));toast('Enregistré — visible sur le site')}catch(e){toast('Erreur : stockage plein (image trop lourde)')}};
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function shrink(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement('canvas');const s=Math.min(1,1100/Math.max(im.width,im.height));
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)}

/* =============== CONNEXION =============== */
function enter(){ $('#login').style.display='none'; $('#dash').hidden=false; renderDash(); }
if(sessionStorage.getItem('nh2_admin')==='1'){enter()}
$('#loginForm').onsubmit=e=>{e.preventDefault();
  if($('#pw').value===PASS){sessionStorage.setItem('nh2_admin','1');enter()}
  else{$('#err').textContent='Mauvais mot de passe.';$('#pw').value='';$('#pw').focus()}};
$('#logout').onclick=()=>{sessionStorage.removeItem('nh2_admin');location.reload()};

/* =============== TABLEAU DE BORD =============== */
let curTab='articles', editing=null;
const TABDEF={articles:{i:'file',t:'Articles'},photos:{i:'image',t:'Photos'},events:{i:'calendar',t:'Événements'}};
function renderDash(){
  $('#brand').innerHTML=ic('camera',18)+'Espace journaliste — N_hebert2';
  $('#seeSite').innerHTML=ic('eye',14)+'Voir le site';
  $('#logout').innerHTML=ic('logout',14)+'Quitter';
  $('#tabs').innerHTML=Object.keys(TABDEF).map(k=>'<button class="tab '+(curTab===k?'on':'')+'" data-tab="'+k+'">'+ic(TABDEF[k].i,15)+TABDEF[k].t+'</button>').join('');
  $('#addBtn').innerHTML=ic('plus',14)+'Ajouter';
  $('#resetBtn').innerHTML=ic('reset',14)+'Réinitialiser';
  $('#note').innerHTML='Vos changements sont enregistrés dans ce navigateur et apparaissent immédiatement sur le site principal (même appareil / même hébergement). Le bouton Réinitialiser restaure le contenu d'exemple.';
  renderList();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){curTab=t.dataset.tab;editing=null;$('#formPanel').hidden=true;renderDash();return}
  if(t.id==='addBtn'){openForm(null);return}
  if(t.id==='resetBtn'){if(confirm('Restaurer tout le contenu d'exemple? Vos ajouts seront perdus.')){DATA=JSON.parse(JSON.stringify(SEED));save();renderList()}return}
  if(t.dataset.edit){openForm(t.dataset.edit);return}
  if(t.dataset.del){if(confirm('Supprimer définitivement cet élément?')){DATA[curTab]=DATA[curTab].filter(x=>x.id!==t.dataset.del);save();renderList()}return}
});
function renderList(){
  $('#panelTitle').textContent=TABDEF[curTab].t+' ('+DATA[curTab].length+')';
  const L=DATA[curTab];
  $('#list').innerHTML=L.map(x=>{
    let thumb='';
    if(curTab==='photos'||(curTab==='articles'&&x.img))thumb=x.img?'<img class="thumb" src="'+x.img+'" alt="">':'<span class="thumb ph" style="display:block;background:linear-gradient(160deg,#2b333c,#12161a)"></span>';
    if(curTab==='articles'&&!x.img)thumb='<span class="thumb" style="display:grid;place-items:center;color:#666">'+ic('file',18)+'</span>';
    if(curTab==='events')thumb='<span class="thumb" style="display:grid;place-items:center;color:#666">'+ic('calendar',18)+'</span>';
    const sub=curTab==='articles'?(CATS[x.cat]||x.cat)+' · '+x.place:curTab==='photos'?(TAGS[x.tag]||x.tag)+' · '+x.place:x.d+' · '+x.place;
    return '<div class="row-item">'+thumb+'<div class="inf"><b>'+x.title+'</b><span>'+sub+'</span></div>'+
     '<div class="acts"><button class="ibtn" data-edit="'+x.id+'">'+ic('pen',12)+'Modifier</button>'+
     '<button class="ibtn del" data-del="'+x.id+'">'+ic('trash',12)+'Supprimer</button></div></div>';
  }).join('')||'<p style="color:var(--mut)">Aucun élément. Cliquez sur Ajouter.</p>';
}

/* =============== FORMULAIRES =============== */
function openForm(id){
  editing=id?DATA[curTab].find(x=>x.id===id):null;
  const today=new Date().toISOString().slice(0,10);
  const v=f=>editing&&editing[f]!==undefined?editing[f]:'';
  let html='';
  if(curTab==='articles')html=
   '<h3>'+(editing?'Modifier l'article':'Nouvel article')+'</h3>'+
   '<div class="row"><label>Titre *</label><input id="fT" required value="'+(v('title')||'').replace(/"/g,'&quot;')+'"></div>'+
   '<div class="grid2"><div class="row"><label>Catégorie</label><select id="fC">'+Object.keys(CATS).map(k=>'<option value="'+k+'" '+(v('cat')===k?'selected':'')+'>'+CATS[k]+'</option>').join('')+'</select></div>'+
   '<div class="row"><label>Date</label><input id="fD" type="date" value="'+(v('date')||today)+'"></div></div>'+
   '<div class="row"><label>Lieu *</label><input id="fP" value="'+(v('place')||'').replace(/"/g,'&quot;')+'" placeholder="Ex. : Québec"></div>'+
   '<div class="row"><label>Photo (optionnel)</label><input id="fI" type="file" accept="image/*">'+(editing&&editing.img?'<p style="font-size:.72rem;color:var(--mut);margin-top:4px">Une photo est déjà attachée — en choisir une autre la remplacera.</p>':'')+'</div>'+
   '<div class="row"><label>Texte — paragraphes séparés par une ligne vide *</label><textarea id="fX">'+(v('text')?v('text').join('\n\n'):'')+'</textarea></div>'+
   '<div class="row"><label><input type="checkbox" id="fF" style="width:auto;margin-right:8px" '+(v('featured')?'checked':'')+'>Mettre à la une</label></div>';
  if(curTab==='photos')html=
   '<h3>'+(editing?'Modifier la photo':'Nouvelle photo')+'</h3>'+
   '<div class="row"><label>Titre *</label><input id="fT" required value="'+(v('title')||'').replace(/"/g,'&quot;')+'"></div>'+
   '<div class="grid2"><div class="row"><label>Galerie</label><select id="fC">'+Object.keys(TAGS).map(k=>'<option value="'+k+'" '+(v('tag')===k?'selected':'')+'>'+TAGS[k]+'</option>').join('')+'</select></div>'+
   '<div class="row"><label>Date</label><input id="fD" type="date" value="'+(v('date')||today)+'"></div></div>'+
   '<div class="row"><label>Lieu</label><input id="fP" value="'+(v('place')||'').replace(/"/g,'&quot;')+'" placeholder="Ex. : Québec"></div>'+
   '<div class="row"><label>Photo (optionnel)</label><input id="fI" type="file" accept="image/*">'+(editing&&editing.img?'<p style="font-size:.72rem;color:var(--mut);margin-top:4px">Une photo est déjà attachée — en choisir une autre la remplacera.</p>':'')+'</div>';
  if(curTab==='events')html=
   '<h3>'+(editing?'Modifier l'événement':'Nouvel événement')+'</h3>'+
   '<div class="row"><label>Titre *</label><input id="fT" required value="'+(v('title')||'').replace(/"/g,'&quot;')+'"></div>'+
   '<div class="grid2"><div class="row"><label>Date *</label><input id="fD" type="date" value="'+(v('date')||today)+'"></div>'+
   '<div class="row"><label>Type</label><select id="fTy"><option '+(v('type')==='Festival'?'selected':'')+'>Festival</option><option '+(v('type')==='Spectacle'?'selected':'')+'>Spectacle</option><option '+(v('type')==='Sportif'?'selected':'')+'>Sportif</option><option '+(v('type')==='Communautaire'?'selected':'')+'>Communautaire</option></select></div></div>'+
   '<div class="grid2"><div class="row"><label>Lieu</label><input id="fP" value="'+(v('place')||'').replace(/"/g,'&quot;')+'"></div>'+
   '<div class="row"><label>Statut</label><select id="fS"><option value="ok" '+(v('status')==='ok'?'selected':'')+'>Couverture confirmée</option><option value="tbc" '+(v('status')==='tbc'?'selected':'')+'>À confirmer</option></select></div></div>';
  html+='<div class="form-acts"><button class="btn" id="fSave">Enregistrer</button><button class="btn ghost" id="fCancel">Annuler</button></div>';
  $('#formPanel').innerHTML=html;$('#formPanel').hidden=false;
  $('#formPanel').scrollIntoView({behavior:'smooth',block:'start'});
  $('#fCancel').onclick=()=>{$('#formPanel').hidden=true;editing=null};
  $('#fSave').onclick=()=>{
    const T=$('#fT').value.trim();if(!T){toast('Le titre est obligatoire');return}
    const P=$('#fP')?$('#fP').value.trim()||'Québec':'Québec';
    const D=$('#fD')?$('#fD').value||today:today;
    const finish=img=>{
      if(curTab==='articles'){
        const item=editing||{id:'c'+Date.now(),views:1};
        item.title=T;item.cat=$('#fC').value;item.place=P;item.date=D;
        item.ph=PHMAP[item.cat];if(img!==undefined)item.img=img;
        item.text=$('#fX').value.split(/\n\s*\n/).filter(Boolean);if(!item.text.length)item.text=[T];
        item.featured=$('#fF').checked?1:0;
        if(!editing)DATA.articles.unshift(item);
      }
      if(curTab==='photos'){
        const item=editing||{id:'c'+Date.now()};
        item.title=T;item.tag=$('#fC').value;item.place=P;item.date=D;item.ph=TGMAP[item.tag];
        if(img!==undefined)item.img=img;
        if(!editing)DATA.photos.unshift(item);
      }
      if(curTab==='events'){
        const item=editing||{id:'c'+Date.now()};
        item.title=T;item.d=D;item.place=P;item.type=$('#fTy').value;item.status=$('#fS').value;
        if(!editing)DATA.events.push(item);
      }
      save();$('#formPanel').hidden=true;editing=null;renderList();
    };
    const f=$('#fI')&&$('#fI').files[0];
    if(f)shrink(f,finish);else finish(undefined);
  };
}
$('#loginLogo').addEventListener('error',function(){this.style.display='none'});
renderDash();
</script>
